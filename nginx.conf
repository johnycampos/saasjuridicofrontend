server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver do Docker Compose. Resolve em tempo de requisição (nao no
    # startup do nginx), entao o container sobe normalmente mesmo quando
    # "backend" nao existe (ex: Cloud Run, onde o frontend chama a API
    # direto via VITE_API_URL e essas rotas ficam sem uso).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /oauth2 {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Só a callback do OAuth2 (/login/oauth2/code/...) precisa ir pro backend.
    # "/login" sozinho é rota do Vue Router (LoginPage) — tem que cair no
    # fallback da SPA (location /) e não ser proxiado, senão qualquer acesso
    # direto a /login (ex: redirect de sessão expirada) vira 502 em ambientes
    # onde "backend" não resolve (Cloud Run).
    location /login/oauth2 {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
